# Incorporar dentro del bloque server HTTPS existente de servicioftth.com.
# Ajustar root a la carpeta absoluta donde se publica Frontend/dist.
# root /var/www/servicioftth/Frontend/dist;
location /api/ {
    # Sin / al final: conserva /api/ al reenviar a Express.
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location / {
    try_files $uri $uri/ /index.html;
}